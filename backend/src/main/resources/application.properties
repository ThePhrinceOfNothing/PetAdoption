# ========================================================
# Supabase PostgreSQL Database Configuration
# ========================================================
spring.application.name=pet-adoption-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&tcpKeepAlive=true&connectTimeout=10&socketTimeout=30}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.tdlbuelsfzszqlknjoap}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Resilient HikariCP Pool for Cloud Supabase Pooler
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# Dynamic Cloud Port Binding
server.port=${PORT:8080}
